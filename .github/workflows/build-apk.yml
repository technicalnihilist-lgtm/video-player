name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending day edits
        if: hashFiles('tools/day4.py') != ''
        run: |
          python3 tools/day4.py
          git config user.name "technicalnihilist-lgtm"
          git config user.email "technicalnihilist@gmail.com"
          git rm -q tools/day4.py
          git add -A
          git commit -q -m "Day 4: settings & persistence pass (v1.0.8)"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Video-Player-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
